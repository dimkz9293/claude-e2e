<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Скоро запуск</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #fff;
      color: #111;
    }
    main { width: 100%; max-width: 360px; padding: 16px; text-align: center; }
    h1 { font-size: 28px; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: #555; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 10px 16px; font-size: 16px; border: 0; border-radius: 6px; background: #111; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Скоро запуск</h1>
    <p>Залиште email, і ми повідомимо першими.</p>
    <form>
      <input type="email" placeholder="you@example.com" required>
      <button type="submit">Підписатися</button>
    </form>
  </main>
</body>
</html>
